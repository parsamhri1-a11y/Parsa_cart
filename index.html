<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b14">
<title>Parsa Mehri | کارت ویزیت دیجیتال</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap');

  :root {
    color-scheme: dark;
    --bg-dark: #030711;
    --card-bg: rgba(14, 28, 48, 0.45);
    --card-border: rgba(110, 200, 255, 0.25);
    --cyan: #38bdf8;
    --blue: #2563eb;
    --purple: #7c3aed;
    --emerald: #10b981;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
    color: var(--text-main);
    background-color: var(--bg-dark);
    overflow-x: hidden;
    perspective: 1200px;
    position: relative;
  }

  .bg-canvas {
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    background: 
      radial-gradient(circle at 30% 30%, rgba(37, 99, 235, 0.32) 0%, transparent 45%),
      radial-gradient(circle at 70% 65%, rgba(124, 58, 237, 0.28) 0%, transparent 45%),
      radial-gradient(circle at 50% 85%, rgba(6, 182, 212, 0.25) 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(16, 185, 129, 0.15) 0%, transparent 35%);
    animation: gradientDrift 16s ease-in-out infinite alternate;
    z-index: -2;
    pointer-events: none;
  }

  .bg-grid {
    position: fixed;
    inset: 0;
    background-image: 
      linear-gradient(rgba(56, 189, 248, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56, 189, 248, 0.04) 1px, transparent 1px);
    background-size: 36px 36px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
    z-index: -1;
    pointer-events: none;
  }

  @keyframes gradientDrift {
    0% {
      transform: translate(0%, 0%) rotate(0deg) scale(1);
    }
    50% {
      transform: translate(-4%, 3%) rotate(4deg) scale(1.06);
    }
    100% {
      transform: translate(3%, -4%) rotate(-3deg) scale(1.02);
    }
  }

  .card-wrapper {
    width: min(100%, 420px);
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
  }

  .card {
    position: relative;
    padding: 38px 26px 30px;
    border-radius: 30px;
    background: var(--card-bg);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--card-border);
    box-shadow: 
      0 30px 70px rgba(0, 0, 0, 0.65),
      0 0 40px rgba(56, 189, 248, 0.15),
      inset 0 1px 1px rgba(255, 255, 255, 0.25),
      inset 0 -1px 1px rgba(56, 189, 248, 0.1);
    text-align: center;
    overflow: hidden;
    transform-style: preserve-3d;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #38bdf8, #a855f7, #38bdf8, transparent);
    background-size: 200% 100%;
    animation: borderShimmer 4s linear infinite;
  }

  .card-glare {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.14), transparent 65%);
    pointer-events: none;
    opacity: 0.7;
    transition: opacity 0.3s;
  }

  @keyframes borderShimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  h1 {
    font-size: 31px;
    font-weight: 900;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #ffffff 20%, #7dd3fc 65%, #c084fc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 18px rgba(56, 189, 248, 0.25));
    transform: translateZ(35px);
  }

  .subtitle {
    margin-bottom: 28px;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 400;
    transform: translateZ(20px);
  }

  .links {
    display: grid;
    gap: 14px;
    transform: translateZ(30px);
  }

  .link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    border-radius: 20px;
    text-decoration: none;
    color: var(--text-main);
    text-align: right;
    background: rgba(15, 31, 53, 0.55);
    border: 1px solid rgba(125, 211, 252, 0.2);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    overflow: hidden;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.28s ease,
                background 0.28s ease,
                box-shadow 0.28s ease;
  }

  .link::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.14), transparent);
    transform: skewX(-25deg);
    transition: left 0.65s ease;
    pointer-events: none;
  }

  .link:hover::after {
    left: 160%;
  }

  .link:hover {
    transform: translateY(-3px) scale(1.02);
    background: rgba(24, 48, 82, 0.78);
    border-color: rgba(56, 189, 248, 0.65);
    box-shadow: 0 14px 30px rgba(14, 165, 233, 0.25);
  }

  .link:active {
    transform: scale(0.96);
    transition-duration: 0.1s;
  }

  .link.whatsapp:hover {
    border-color: rgba(34, 197, 94, 0.7);
    box-shadow: 0 14px 30px rgba(34, 197, 94, 0.25);
  }

  .link.instagram:hover {
    border-color: rgba(236, 72, 153, 0.7);
    box-shadow: 0 14px 30px rgba(236, 72, 153, 0.25);
  }

  .icon {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: linear-gradient(145deg, rgba(30, 64, 108, 0.9), rgba(15, 35, 64, 0.9));
    border: 1px solid rgba(125, 211, 252, 0.25);
    color: #38bdf8;
    flex: none;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  }

  .link.whatsapp .icon {
    background: linear-gradient(145deg, rgba(16, 185, 129, 0.25), rgba(6, 78, 59, 0.5));
    border-color: rgba(52, 211, 153, 0.35);
    color: #34d399;
  }

  .link.instagram .icon {
    background: linear-gradient(145deg, rgba(236, 72, 153, 0.25), rgba(131, 24, 67, 0.45));
    border-color: rgba(244, 114, 182, 0.35);
    color: #f472b6;
  }

  .link:hover .icon {
    transform: scale(1.12) rotate(-6deg);
  }

  .icon svg {
    width: 23px;
    height: 23px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .text {
    display: grid;
    gap: 3px;
    flex: 1;
    min-width: 0;
  }

  .label {
    font-size: 14.5px;
    font-weight: 800;
    color: #f1f5f9;
  }

  .value {
    font-size: 12.5px;
    color: #93c5fd;
    direction: ltr;
    text-align: right;
    overflow-wrap: anywhere;
    font-weight: 600;
  }

  .link.whatsapp .value {
    color: #6ee7b7;
  }

  .link.instagram .value {
    color: #f9a8d4;
  }

  .arrow {
    color: #7dd3fc;
    font-size: 20px;
    font-weight: bold;
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .link:hover .arrow {
    transform: translateX(-6px);
  }

  .footer {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px solid rgba(148, 163, 184, 0.15);
    color: var(--text-muted);
    font-size: 11.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    transform: translateZ(15px);
  }

  .copy-btn {
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #7dd3fc;
    padding: 6px 12px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .copy-btn:hover {
    background: rgba(56, 189, 248, 0.3);
    transform: translateY(-1px);
  }

  .copy-btn:active {
    transform: scale(0.94);
  }

  @media (prefers-reduced-motion: reduce) {
    .bg-canvas, .card::before { animation: none; }
    .link, .card-wrapper { transition: none; }
  }
</style>
</head>
<body>
  <div class="bg-canvas" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <div class="card-wrapper" id="cardWrapper">
    <main class="card" id="card">
      <div class="card-glare" id="cardGlare" aria-hidden="true"></div>

      <h1>Parsa Mehri</h1>
      <p class="subtitle">کارت ویزیت دیجیتال شخصی</p>

      <nav class="links" aria-label="راه‌های ارتباطی">
        <a class="link whatsapp" href="https://wa.me/989100088271" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 21l1.65-3.8a9 9 0 1 1 3.4 2.9L3 21"/>
              <path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"/>
            </svg>
          </span>
          <span class="text">
            <span class="label">پیام در واتس‌اپ</span>
            <span class="value">+98 910 008 8271</span>
          </span>
          <span class="arrow" aria-hidden="true">←</span>
        </a>

        <a class="link instagram" href="https://www.instagram.com/parsa_iran14/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="5"/>
              <circle cx="12" cy="12" r="4"/>
              <path d="M17.5 6.5h.01"/>
            </svg>
          </span>
          <span class="text">
            <span class="label">پیج اینستاگرام</span>
            <span class="value">@parsa_iran14</span>
          </span>
          <span class="arrow" aria-hidden="true">←</span>
        </a>

        <a class="link phone" href="tel:+989100088271">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 4h4l2 5-2.5 1.5a15 15 0 0 0 5 5L15 13l5 2v4c0 1.1-.9 2-2 2C9.7 21 3 14.3 3 6c0-1.1.9-2 2-2Z"/>
            </svg>
          </span>
          <span class="text">
            <span class="label">تماس مستقیم</span>
            <span class="value">0910 008 8271</span>
          </span>
          <span class="arrow" aria-hidden="true">←</span>
        </a>
      </nav>

      <div class="footer">
        <span>خوشحال می‌شوم در ارتباط باشیم</span>
        <button type="button" class="copy-btn" id="copyBtn" onclick="copyNumber()">کپی شماره</button>
      </div>
    </main>
  </div>

<script>
  const wrapper = document.getElementById('cardWrapper');
  const glare = document.getElementById('cardGlare');

  function applyTilt(xRatio, yRatio) {
    const rotateY = xRatio * 12;
    const rotateX = -yRatio * 12;
    wrapper.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    const glareX = 50 + xRatio * 40;
    const glareY = 50 + yRatio * 40;
    glare.style.background = `radial-gradient(circle at ${glareX}% ${glareY}%, rgba(255, 255, 255, 0.18), transparent 65%)`;
  }

  document.addEventListener('mousemove', (e) => {
    const xRatio = (e.clientX / window.innerWidth - 0.5) * 2;
    const yRatio = (e.clientY / window.innerHeight - 0.5) * 2;
    applyTilt(xRatio, yRatio);
  });

  document.addEventListener('mouseleave', () => {
    wrapper.style.transform = 'rotateX(0deg) rotateY(0deg)';
  });

  window.addEventListener('deviceorientation', (e) => {
    if (e.gamma !== null && e.beta !== null) {
      const xRatio = Math.max(-1, Math.min(1, e.gamma / 30));
      const yRatio = Math.max(-1, Math.min(1, (e.beta - 45) / 30));
      applyTilt(xRatio, yRatio);
    }
  });

  function copyNumber() {
    navigator.clipboard.writeText('09100088271').then(() => {
      const btn = document.getElementById('copyBtn');
      const oldText = btn.textContent;
      btn.textContent = 'کپی شد ✓';
      btn.style.borderColor = '#10b981';
      btn.style.color = '#34d399';
      setTimeout(() => {
        btn.textContent = oldText;
        btn.style.borderColor = '';
        btn.style.color = '';
      }, 2000);
    });
  }
</script>
</body>
</html>
